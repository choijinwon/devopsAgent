    name: ubuntu
    docker_target: g0-ubuntu
    description: Ubuntu base layer
  g1:
    name: cuda
    docker_target: g1-cuda
    description: NVIDIA CUDA runtime on Ubuntu
  g2:
    name: python
    docker_target: g2-python
    description: Python virtualenv and build tools
  g3:
    name: pytorch
    docker_target: g3-pytorch
