apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
    spec:
      serviceAccountName: buildkitd
      containers:
        - name: buildkitd
          image: moby/buildkit:rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            - --config
            - /etc/buildkit/buildkitd.toml
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            tcpSocket:
              port: buildkit
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: buildkit
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: buildkit-cache
              mountPath: /home/user/.local/share/buildkit
            - name: buildkit-config
              mountPath: /etc/buildkit
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: buildkit-cache
          emptyDir: {}
        - name: buildkit-config
          configMap:
            name: buildkitd-config
        - name: tmp
          emptyDir: {}
