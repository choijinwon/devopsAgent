apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildkit-client
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/portforward", "services"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildkit-client
subjects:
  - kind: ServiceAccount
    name: buildkitd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildkit-client
