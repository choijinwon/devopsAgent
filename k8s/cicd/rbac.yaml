apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cicd-runner
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflowtaskresults
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cicd-runner
subjects:
  - kind: ServiceAccount
    name: cicd-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cicd-runner
