apiVersion: batch/v1
kind: Job
metadata:
  generateName: mlflow-yolo-register-
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow-yolo-register
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-yolo-register
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: register
          image: host.docker.internal:8080/library/layered-kserve:u24-cu128-py312-torch210-mlflow3152-kserve0190-c269b4c78ded-g6
          imagePullPolicy: IfNotPresent
          command: [sh, -lc]
          args:
            - |
              set -eu
              pip install --no-cache-dir 'polars[rtcompat]==1.44.1'
              pip install --no-cache-dir \
                'opencv-python-headless<5' \
                'nvidia-ml-py>=12' \
                'ultralytics-platform>=0.1.32' \
                'ultralytics-thop>=2.1.6'
              pip install --no-cache-dir --no-deps 'ultralytics==8.4.144'
              python /scripts/register_and_test.py
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow-mlflow.mlflow.svc.cluster.local:5000
            - name: MLFLOW_EXPERIMENT_NAME
              value: yolo-registration
            - name: MLFLOW_REGISTERED_MODEL_NAME
              value: yolo11n-detector
            - name: YOLO_MODEL
              value: yolo11n.pt
            - name: YOLO_SAMPLE_IMAGE
              value: https://ultralytics.com/images/bus.jpg
            - name: YOLO_CONFIG_DIR
              value: /tmp/ultralytics-config
            - name: YOLO_WORK_DIR
              value: /work
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: false
            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: scripts
          configMap:
            name: mlflow-yolo-code
        - name: work
          emptyDir: {}
