replicaCount: 1

server:
  value_options:
    host: "0.0.0.0"
    port: 5000
    workers: 2
  flag_options:
    - serve_artifacts

service:
  type: ClusterIP

mlflow:
  backendStoreUri: "sqlite:////mlflow/mlflow.db"
  artifactsDestination: "/mlflow/artifacts"

storage:
  enabled: true
  size: 10Gi
  accessMode: ReadWriteOnce
  storageClassName: standard
  mountPath: /mlflow

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

networkPolicy:
  enabled: false

metrics:
  enabled: false
